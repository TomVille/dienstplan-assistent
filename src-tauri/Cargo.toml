[package]
name = "dienstplan-assistent"
version = "1.2.1"
description = "Dienstplan-Assistent – monatlicher Dienstplan mit Vorschlag, Drag & Drop und Stundenkonto"
authors = ["Thomas Blum"]
edition = "2021"

[lib]
name = "dienstplan_assistent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dieselbe sqlx-Version wie tauri-plugin-sql (keine zweite Kopie), für echte Transaktionen beim Speichern
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
